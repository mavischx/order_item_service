<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food orders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <script src="main.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        h1 { font-weight: 700; margin-bottom: 1.5rem; }
        .section-card { background: #fff; border-radius: 8px; padding: 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .table thead th { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .table tbody tr:hover { background-color: #f1f3f5; }
        .status-bar { font-size: 0.9rem; color: #555; }
        .status-bar span { font-weight: 600; color: #212529; }
        h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.75rem; }
        input.form-control-sm { border-radius: 4px; }
    </style>
</head>

<body class="p-4">

    <h1 class="text-center">Orders of the Day</h1>

    <div class="row">
        <div class="col-8">
            <div class="section-card mb-3">
            <table class="table table-sm table-hover mb-0">
                <thead class="thead-light">
                    <tr>
                        <th>Order ID</th>
                        <th>Customer Name</th>
                        <th>Item ID</th>
                        <th>Quantity</th>
                        <th>Address</th>
                    </tr>
                </thead>
                <tbody id="orderTable"></tbody>
            </table>
            </div>

            <div class="d-flex align-items-center mb-3 status-bar">
                <span class="mr-3 h5">Status: <span id="statusCode">—</span></span>
                <span class="mr-3 h5">ETag: <span id="eTag">—</span></span>
                <button class="btn btn-sm btn-outline-secondary mr-2" onclick="fetchOrders()">↻ Refresh</button>
                <button type="button" class="btn btn-sm btn-outline-info" onclick="fetchOneOrder()">Check order</button>
                <input type="number" id="getOneOrderId" class="form-control form-control-sm ml-2" style="width:100px" placeholder="Order ID" />
            </div>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Order Details</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <p id="customerNameModal"></p>
        <p id="itemIdModal"></p>
        <ul>
            <li id="itemNameModal"></li>
            <li id="itemCategoryModal"></li>
            <li id="itemPriceModal"></li>
        </ul>
        <p id="quantityModal"></p>
        <p id="addressModal"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

            <div class="row mt-2">
                <div class="col-md">
                    <div class="section-card">
                    <h2>Add Order</h2>
                    <table class="table table-sm">
                        <tr>
                            <th>Customer name</th>
                            <td><input type="text" id="customerNameAdd" class="form-control form-control-sm"></td>
                        </tr>
                        <tr>
                            <th>Item ID</th>
                            <td><input type="number" id="itemIdAdd" class="form-control form-control-sm"></td>
                        </tr>
                        <tr>
                            <th>Quantity</th>
                            <td><input type="number" id="quantityAdd" class="form-control form-control-sm"></td>
                        </tr>
                        <tr>
                            <th>Address</th>
                            <td><input type="text" id="addressAdd" class="form-control form-control-sm"></td>
                        </tr>
                    </table>
                    <button class="btn btn-sm btn-success" id="submitOrder" onclick="addOrder()">Submit order</button>
                    </div>
                </div>
                <div class="col-md">
                    <div class="section-card">
                    <h2 class="d-flex align-items-center">Edit Order <input type="number" id="orderEditId" class="form-control form-control-sm ml-2" style="width:100px" placeholder="Order ID" /></h2>
                    <table class="table table-sm">
                        <tr>
                            <th>Customer name</th>
                            <td><input type="text" id="customerName" class="form-control form-control-sm"></td>
                        </tr>
                        <tr>
                            <th>Item ID</th>
                            <td><input type="number" id="itemId" class="form-control form-control-sm"></td>
                        </tr>
                        <tr>
                            <th>Quantity</th>
                            <td><input type="number" id="quantity" class="form-control form-control-sm"></td>
                        </tr>
                        <tr>
                            <th>Address</th>
                            <td><input type="text" id="address" class="form-control form-control-sm"></td>
                        </tr>
                    </table>
                    <button class="btn btn-sm btn-warning" id="editOrder" onclick="editOrder()">Edit order</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-4">
            <div class="section-card">
            <table class="table table-sm table-hover mb-0">
                <thead class="thead-dark">
                    <tr>
                        <th>Item ID</th>
                        <th>Item</th>
                        <th>Category</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody id="itemTable"></tbody>
            </table>
            </div>
        </div>
    </div>







    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
</body>

</html>
