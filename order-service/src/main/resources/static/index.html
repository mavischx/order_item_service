<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food orders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <script src="main.js"></script>
</head>

<body class="p-4">

    <h1 class="text-center">Orders of the day</h1>

    <div class="row">
        <div class="col-8">
            <table class="table">
                <thead class="thead-light">
                    <tr>
                        <th>Order ID</th>
                        <th>Customer Name</th>
                        <th>Item ID</th>
                        <th>Quantity</th>
                        <th>Address</th>
                    </tr>
                </thead>
                <tbody id="orderTable"></tbody>
            </table>

            <h3>Status Code: <h3 id="statusCode"></h3>
            </h3>
            <h3>Etag: <h3 id="eTag"></h3>
            </h3>
            <button class="btn btn-primary" id="Refresh" onclick="fetchOrders()">Refresh orders</button>
            <!-- <button class="btn btn-primary" id="Refresh" onclick="fetchOneOrder()">Check order detail</button> -->
            <!-- Button trigger modal -->
            <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#exampleModal"
                onclick="fetchOneOrder()">
                Check order detail
            </button> <input type="number" id="getOneOrderId" class="ml-3" style="width:150px" />
            <div class="table">
                <h3>Order details</h3>
                <p id="customerNameModal"></p>
                <p id="itemIdModal"></p>

                <p id="itemNameModal"></p>
                 
                <p id="itemCategoryModal"></p>
               
                <p id="itemPriceModal"></p>
                   

                <p id="quantityModal"></p>
                <p id="addressModal"></p>
            </div>
            <!-- Modal -->
            <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
                aria-hidden="true">
                <div class="modal-dialog" role="document">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <div class="">
                            <h3>Order details</h3>
                            <p id="customerNameModal"></p>
                            <p id="itemIdModal"></p>
                            <ul>
                                <li id="itemNameModal"></li>
                                <li id="itemCategoryModal"></li>
                                <li id="itemPriceModal"></li>
                            </ul>
                            <p id="quantityModal"></p>
                            <p id="addressModal"></p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                            <button type="button" class="btn btn-primary">Save changes</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mt-4">
                <div class="col-md">
                    <h2>Add order</h2>
                    <table class="table">
                        <tr>
                            <th>Customer name</th>
                            <td><input type="text" id="customerNameAdd"></td>
                        </tr>
                        <tr>
                            <th>Item ID</th>
                            <td><input type="number" id="itemIdAdd"></td>
                        </tr>
                        <tr>
                            <th>Quantity</th>
                            <td><input type="number" id="quantityAdd"></td>
                        </tr>
                        <tr>
                            <th>Address</th>
                            <td><input type="text" id="addressAdd"></td>
                        </tr>
                    </table>
                    <button class="btn btn-primary" id="submitOrder" onclick="addOrder()">Submit order</button>
                </div>
                <div class="col-md">
                    <h2 class="d-flex align-items-center">Edit order <input type="number" id="orderEditId" class="ml-3"
                            style="width:150px" /></h2>
                    <table class="table">
                        <tr>
                            <th>Customer name</th>
                            <td><input type="text" id="customerName"></td>
                        </tr>
                        <tr>
                            <th>Item ID</th>
                            <td><input type="number" id="itemId"></td>
                        </tr>
                        <tr>
                            <th>Quantity</th>
                            <td><input type="number" id="quantity"></td>
                        </tr>
                        <tr>
                            <th>Address</th>
                            <td><input type="text" id="address"></td>
                        </tr>
                    </table>
                    <button class="btn btn-primary" id="editOrder" onclick="editOrder()">Edit order</button>
                </div>
            </div>
        </div>
        <div class="col-4">
            <table class="table">
                <thead class="thead-dark">
                    <tr>
                        <th>Item ID</th>
                        <th>Item</th>
                        <th>Category</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody id="itemTable"></tbody>
            </table>
        </div>
    </div>







</body>

</html>
