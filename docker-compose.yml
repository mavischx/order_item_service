version: "2.2"

services:
  item-service:
    build: ./item-service
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080

  order-service:
    build: ./order-service
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - ITEM_SERVICE_URL=http://item-service:8080
    depends_on:
      - item-service